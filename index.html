<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Aula d'Acollida Digital | Suport Lingüístic i Social</title>
  
  <!-- Script ràpid anti-parpelleig per a Mode Fosc/Clar per defecte del dispositiu -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('acollida_theme');
      if (savedTheme === 'dark' || savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>

  <!-- Favicon visual i minimalista (SVG) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Tipografia per a Català i suport natiu Àrab -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=1.5">
</head>
<body>

  <!-- BARRA SUPERIOR / CAPÇALERA -->
  <header class="app-header" role="banner">
    <div class="header-container">
      <div class="logo-area" onclick="App.renderCategoriesView()" style="cursor: pointer;" tabindex="0" role="button" aria-label="Anar a la pàgina d'inici de temes">
        <span class="logo-icon" aria-hidden="true">🎒</span>
        <div class="logo-title">
          <h1>Aula d'Acollida Digital</h1>
          <p>Suport Lingüístic Inicial • Generalitat de Catalunya</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Botó selector de mode fosc / clar -->
        <button 
          id="theme-toggle-btn" 
          class="theme-toggle-btn" 
          onclick="ThemeManager.toggleTheme()" 
          title="Canviar mode clar / fosc" 
          aria-label="Canviar entre mode clar i fosc">
          🌓
        </button>

        <div id="user-badge" class="user-badge" style="display: none;">
          <div class="avatar" aria-hidden="true">👤</div>
          <span id="user-name-display">Alumne</span>
          <button 
            onclick="App.clearSession()" 
            title="Canviar d'alumne / Nova sessió"
            aria-label="Canviar d'alumne o reiniciar la sessió"
            style="background:none; border:none; cursor:pointer; font-size: 0.9rem; margin-left: 0.5rem; opacity: 0.7;">
            🔄
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDOR DINÀMIC PRINCIPAL -->
  <main class="main-wrapper" id="main-wrapper" role="main">
    <!-- El contingut es renderitza dinàmicament des de js/app.js -->
  </main>

  <!-- CONTENIDOR PER A MODALS I PASSAPORT IMPRIMIBLE -->
  <div id="modal-container" aria-live="polite"></div>

  <!-- PEU DE PÀGINA RESUMIT I CONTINGUT SEGONS SKILL APPS-ESCOLARS -->
  <footer class="app-footer" role="contentinfo">
    <div class="footer-content">
      <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer" title="Llicència Creative Commons BY-SA 4.0">
        <img src="https://mirrors.creativecommons.org/presskit/buttons/88x31/svg/by-sa.svg" alt="CC BY-SA 4.0" class="cc-badge" width="70" height="24" />
      </a>
      <span class="footer-legal">
        © David Cordones · 2026 | Codi: <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer">AGPL v3</a> · Contingut: <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>
      </span>
    </div>
  </footer>

  <!-- SCRIPTS DE L'APLICACIÓ -->
  <script src="js/data.js?v=1.5"></script>
  <script src="js/audio.js?v=1.5"></script>
  <script src="js/app.js?v=1.5"></script>
</body>
</html>
