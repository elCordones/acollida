<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient de fons Blau Educació / Acollida -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Gradient daurat/ambre per a la bafarada de l'alumne nouvingut -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <!-- Ombra suau moderna per donar volum i separació -->
    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fons squircle arrodonit modern -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Bafarada 1: L'Acollida Escolar i la Llengua (Blanca, superior dreta) -->
  <g filter="url(#bubbleShadow)">
    <path d="M 23 13 
             C 17 13, 13 17.5, 13 23.5 
             C 13 28.2, 16 32, 20.5 33.3 
             L 19 39.5 
             L 26 35.3 
             C 27.8 35.8, 29.8 36, 32 36 
             C 42.5 36, 51 28.5, 51 23.5 
             C 51 17.5, 42.5 13, 32 13 
             Z" 
          fill="#ffffff" />
    <!-- 3 Punts de comunicació en blau vibrant -->
    <circle cx="26" cy="23.5" r="2.2" fill="#2563eb" />
    <circle cx="32" cy="23.5" r="2.2" fill="#2563eb" />
    <circle cx="38" cy="23.5" r="2.2" fill="#2563eb" />
  </g>

  <!-- Bafarada 2: La Veu de l'Alumne Nouvingut (Ambre daurat càlid, frontal inferior esquerra) -->
  <g filter="url(#bubbleShadow)">
    <path d="M 33 26 
             C 43.5 26, 51 31.5, 51 37.5 
             C 51 43.5, 43.5 49, 33 49 
             C 30.2 49, 27.8 48.5, 25.5 47.6 
             L 18 51.5 
             L 20.2 45.2 
             C 17 43.3, 15 40.5, 15 37.5 
             C 15 31.5, 22.5 26, 33 26 
             Z" 
          fill="url(#warmGrad)" />
    <!-- 3 Punts de comunicació en blanc -->
    <circle cx="27" cy="37.5" r="2" fill="#ffffff" />
    <circle cx="33" cy="37.5" r="2" fill="#ffffff" />
    <circle cx="39" cy="37.5" r="2" fill="#ffffff" />
  </g>
</svg>
